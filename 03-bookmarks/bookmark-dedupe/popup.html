<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>북마크 중복 정리</title>
  <style>
    body { width: 420px; margin: 0; padding: 12px; font: 13px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: #222; }
    h1 { font-size: 15px; margin: 0 0 6px; }
    button { padding: 6px 12px; border: 1px solid #888; border-radius: 4px; background: #f4f4f4; cursor: pointer; font: inherit; }
    button.danger { background: #d93025; border-color: #d93025; color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
    #summary { font-weight: bold; margin: 8px 0 4px; }
    #result { max-height: 260px; overflow-y: auto; border-top: 1px solid #ddd; }
    .grp { padding: 6px 0; border-bottom: 1px solid #eee; }
    .grp .u { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
    .grp label { display: block; margin-left: 4px; }
    .grp .p { color: #666; font-size: 12px; }
    h2 { font-size: 13px; margin: 8px 0 2px; }
    #msg { min-height: 18px; color: #0a7a2f; }
    .hint { color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <h1>북마크 중복 정리</h1>
  <p class="hint">주소 끝의 #, 광고 추적 꼬리표(utm 등)가 달라도 같은 페이지로 봅니다. 각 묶음에서 <b>남길 북마크</b>를 고르면 나머지가 정리 대상입니다.</p>
  <div class="row"><button id="scan">검사하기</button></div>
  <div id="summary"></div>
  <div id="result"></div>
  <div class="row">
    <button id="backup" disabled>1) 백업 저장(JSON)</button>
    <button id="apply" class="danger" disabled>2) 선택한 항목 정리</button>
  </div>
  <div class="hint">정리한 북마크는 되돌릴 수 없습니다. 먼저 백업을 저장해야 정리 버튼이 켜집니다.</div>
  <div id="msg" role="status"></div>
  <script src="bookmark-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
