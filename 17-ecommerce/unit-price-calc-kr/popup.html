<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>단위가격 비교 계산기</title><link rel="stylesheet" href="popup.css">
<style>.item{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px}.item .wide{grid-column:1/3}.item .row2{display:flex;gap:4px}</style></head>
<body><main>
  <h1>단위가격 비교 계산기</h1>
  <div class="muted">상품마다 가격, 용량, 묶음 수를 적으면 같은 기준으로 비교합니다.</div>
  <div id="items"></div>
  <div class="row" style="margin-top:8px">
    <button id="add">상품 추가</button>
    <button id="reset" class="danger">모두 지우기</button>
  </div>
  <div class="card" id="result"><div class="muted">숫자를 입력하면 결과가 나옵니다.</div></div>
  <div class="msg" id="msg" role="status"></div>
</main><script src="calc.js"></script><script src="popup.js"></script></body></html>
