<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>한국형 SEO 메타 점검</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: 440px; }
    .pv { border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; margin-top: 6px; }
    .pv .t { color: #1a0dab; font-size: 16px; }
    .pv .u { color: #006621; font-size: 12px; word-break: break-all; }
    .pv .d { color: #545454; font-size: 13px; }
    .pill { display: inline-block; min-width: 54px; font-size: 11.5px; font-weight: 700; margin-right: 6px; }
    #list li { word-break: break-all; }
    .nm { font-weight: 700; margin-right: 4px; }
  </style>
</head>
<body>
  <h1>한국형 SEO 메타 점검</h1>
  <div class="btns"><button id="run" class="primary" type="button">이 페이지 점검하기</button></div>
  <p id="msg" class="msg" role="status"></p>
  <div id="result" hidden>
    <h2>검색 결과 미리보기 (어림)</h2>
    <div class="pv"><div class="t" id="pvT"></div><div class="u" id="pvU"></div><div class="d" id="pvD"></div></div>
    <h2>점검 결과</h2>
    <ul id="list" class="list"></ul>
  </div>
  <details>
    <summary>기준 길이 바꾸기 (저장됨)</summary>
    <div class="row">
      <div><label for="titleMax">제목 최대 글자</label><input id="titleMax" type="number" min="1"></div>
      <div><label for="descMin">설명 최소</label><input id="descMin" type="number" min="1"></div>
      <div><label for="descMax">설명 최대</label><input id="descMax" type="number" min="1"></div>
    </div>
  </details>
  <p class="hint">기본 기준(제목 30자, 설명 70~90자)은 흔히 쓰는 <b>어림 기준</b>이며 검색엔진이 공식으로 정한 값이 아닙니다. 페이지 내용은 밖으로 보내지 않습니다.</p>
  <script src="seo-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
