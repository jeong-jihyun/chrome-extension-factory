<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>가격 메모</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
  <h1>가격 메모</h1>
  <div class="muted">페이지에서 가격 글자를 드래그 → 우클릭 → "가격 메모에 기록". 또는 아래에 직접 입력하세요.</div>
  <div class="row" style="margin-top:8px">
    <input id="price" type="number" min="0" step="any" placeholder="지금 보는 페이지의 가격(원)">
    <button id="rec" class="primary">기록</button>
  </div>
  <div class="msg" id="msg" role="status"></div>
  <div id="list"></div>
  <div class="muted" id="empty">아직 기록한 상품이 없습니다.</div>
</main><script src="lib.js"></script><script src="popup.js"></script></body></html>
